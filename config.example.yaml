# pulse-prober configuration (example)
# Mount read-only: -v $PWD/config.yaml:/etc/pulse/config.yaml:ro
# Reload with `kill -HUP <pid>` — on a validation error the last-good config stays live.

prober:
  name: prober-cloud            # unique; the viewer attributes every result to it
  labels:                        # optional, travel with every push
    region: dc-1
  metrics_listen: ":8081"        # /metrics + /healthz (Prometheus later; viewer never uses it)
  max_concurrent_probes: 32

viewer:
  url: https://pulse.example.com # push target; POST /api/v1/ingest
  push_interval: 10s             # batch cadence (state changes are sent immediately)
  push_timeout: 5s
  queue_size: 10000              # bounded FIFO while the viewer is unreachable
  token_env: PULSE_INGEST_TOKEN  # token is read from this env var, never from the file
  # tls_insecure_skip_verify: false

# maintenance:                   # planned windows: still recorded, not counted DOWN
#   - from: 2026-12-01T00:00:00Z
#     to: 2026-12-01T03:00:00Z
#     reason: monthly patching

defaults:                        # per-target keys override these
  interval: 30s
  timeout: 5s
  confirm_down: 2                # consecutive failures before DOWN
  confirm_up: 1
  follow_redirects: true
  max_body_bytes: 65536

probes:
  # ---------------------------------------------------------------- HTTPS + assertions
  - name: api
    group: web
    type: http
    url: https://api.example.com/health
    interval: 30s
    expect:
      status: [200]
      json_path:
        path: "$.status"
        equals: "ok"
      tls_expiry_min: 336h       # warn if the cert expires within 14 days
    # headers:
    #   Authorization: "Bearer ${PROBE_TOKEN}"   # env-substituted, never logged

  # ---------------------------------------------------------------- plain HTTP
  - name: dashboard
    group: web
    type: http
    url: http://dashboard.default.svc.cluster.local:8080/
    expect:
      status: [200, 204]
      body_regex: "(?i)healthy"

  # ---------------------------------------------------------------- TCP port
  - name: postgres-primary
    group: data
    type: tcp
    address: 192.0.2.10:5432
    interval: 60s
    timeout: 3s

  # ---------------------------------------------------------------- TCP via hostname
  - name: redis-shared
    group: data
    type: tcp
    address: redis.data.svc.cluster.local:6379

  # ---------------------------------------------------------------- ICMP (opt-in)
  # Requires CAP_NET_RAW / container `cap_add: [NET_RAW]`.
  # - name: gateway-edge
  #   group: network
  #   type: icmp
  #   address: 203.0.113.10
  #   interval: 60s

  # ---------------------------------------------------------------- maintenance window
