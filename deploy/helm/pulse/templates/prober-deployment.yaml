{{- $usesIngestEnv := or .Values.viewer.ingest.existingSecret (not (or .Values.viewer.ingest.tokens .Values.viewer.ingest.existingTokensSecret)) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pulse.fullname" . }}-prober
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: prober
spec:
  replicas: {{ .Values.prober.replicaCount }}
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: prober
  template:
    metadata:
      labels:
        {{- include "pulse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: prober
      annotations:
        {{- if $usesIngestEnv }}
        pulse/ingest-revision: {{ .Values.viewer.ingest.revision | quote }}
        {{- end }}
        {{- if not .Values.prober.existingConfigMap }}
        {{- $configMap := include (print $.Template.BasePath "/prober-configmap.yaml") . | fromYaml }}
        checksum/config: {{ index $configMap.data "config.yaml" | sha256sum }}
        {{- end }}
        {{- with .Values.prober.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pulse.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: prober
          image: {{ include "pulse.proberImage" . }}
          imagePullPolicy: {{ .Values.prober.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --config
            - /etc/pulse/config.yaml
          ports:
            # /metrics and /healthz only. Never exposed through a Service: the
            # viewer learns everything by push, so the prober needs no inbound.
            - name: metrics
              containerPort: {{ .Values.prober.metricsPort }}
              protocol: TCP
          {{- if $usesIngestEnv }}
          env:
            - name: {{ .Values.prober.tokenEnv | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "pulse.proberSecretName" . }}
                  key: PULSE_INGEST_TOKEN
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.prober.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pulse
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ default (printf "%s-prober" (include "pulse.fullname" .)) .Values.prober.existingConfigMap }}
      {{- with .Values.prober.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prober.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prober.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
