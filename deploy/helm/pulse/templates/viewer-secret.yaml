{{- include "pulse.validate" . -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.viewerSecretName" . }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
# Generated values are reused on upgrade via lookup, so a `helm upgrade` does not
# silently rotate the token out from under the running prober.
{{- $token := .Values.viewer.ingest.token }}
{{- if not $token }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pulse.viewerSecretName" .) }}
{{- if and $existing $existing.data (hasKey $existing.data "PULSE_INGEST_TOKEN") }}
{{- $token = index $existing.data "PULSE_INGEST_TOKEN" | b64dec }}
{{- else }}
{{- $token = randAlphaNum 32 }}
{{- end }}
{{- end }}
data:
  {{- if .Values.viewer.auth.passwordHash }}
  PULSE_AUTH_PASSWORD_HASH: {{ .Values.viewer.auth.passwordHash | b64enc | quote }}
  {{- else }}
  PULSE_AUTH_PASSWORD: {{ .Values.viewer.auth.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.viewer.ingest.tokens }}
  PULSE_INGEST_TOKENS: {{ .Values.viewer.ingest.tokens | b64enc | quote }}
  {{- else }}
  PULSE_INGEST_TOKEN: {{ $token | b64enc | quote }}
  {{- end }}
