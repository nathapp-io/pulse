{{- $ingest := .Values.viewer.ingest }}
{{- if include "pulse.managesIngest" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulse.managedIngestSecretName" . }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $ingest.tokens }}
  PULSE_INGEST_TOKENS: {{ $ingest.tokens | b64enc | quote }}
  {{- else }}
  {{- $token := $ingest.token | b64enc }}
  {{- if not $token }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "pulse.managedIngestSecretName" .) }}
  {{- if and $existing $existing.data }}
  {{- $token = index $existing.data "PULSE_INGEST_TOKEN" }}
  {{- end }}
  {{- if not $token }}{{- $token = randAlphaNum 32 | b64enc }}{{- end }}
  {{- end }}
  PULSE_INGEST_TOKEN: {{ $token | quote }}
  {{- end }}
{{- end }}
