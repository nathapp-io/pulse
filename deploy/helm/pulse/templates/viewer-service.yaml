apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulse.viewerServiceName" . }}
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: viewer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.viewer.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pulse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: viewer
