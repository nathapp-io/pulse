{{- if .Values.viewer.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pulse.fullname" . }}-viewer
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
  {{- if .Values.viewer.persistence.keepOnDelete }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.viewer.persistence.accessModes | nindent 4 }}
  {{- if .Values.viewer.persistence.storageClass }}
  storageClassName: {{ .Values.viewer.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.viewer.persistence.size }}
{{- end }}
